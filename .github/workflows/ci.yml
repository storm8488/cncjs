        echo "• GITHUB_REF_TYPE=$GITHUB_REF_TYPE" # `branch` or `tag`
        echo "• GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
        echo "• GITHUB_SHA=$GITHUB_SHA"
        echo "• RUNNER_ARCH=$RUNNER_ARCH"
        echo "• RUNNER_NAME=$RUNNER_NAME"
        echo "• RUNNER_OS=$RUNNER_OS"
        echo "• RUNNER_TEMP=$RUNNER_TEMP"
        echo "• RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
    - name: Enable the repository's Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare "yarn@${YARN_VERSION}" --activate
        test "$(yarn --version)" = "${YARN_VERSION}"
    - name: Install dependencies from the lockfile and run the tests on this platform
      run: |
        yarn install --immutable
        yarn test
    - name: Run "build" script
      if: github.ref_type == 'tag'
      run: yarn run build
    - name: Run "build-latest" script
      if: github.ref_type == 'branch'
      run: yarn run build-latest
    - name: Build macOS binaries
      # On this Intel runner, `hdiutil detach` of the DMG staging volume failed with
      # "Resource busy" on every master run: Spotlight and XProtect keep it open.
      # Stop them, and retry the build if the detach still fails.
      shell: bash
      run: |
        sudo mdutil -a -i off || true
        sudo pkill -9 XProtect || true
        for attempt in 1 2 3; do
          yarn run build:macos-x64 && exit 0
          echo "build:macos-x64 failed (attempt $attempt)"
          sleep 10
        done
        exit 1
    - name: Prepare release assets
      shell: bash
      run: |
        GIT_COMMIT_LOG=`git log -1 --format='%ci %H %s'`
        PRODUCT_NAME=CNCjs
        PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
        PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
        mkdir -p releases/macos
        cp -af "output/${PRODUCT_NAME}-${PACKAGE_VERSION}.dmg" "releases/macos/${PACKAGE_NAME}-${PACKAGE_VERSION}-macos-x64.dmg"
        ls -al output releases/macos
        if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "master" ]]; then
          yarn github-release delete \
            --owner=cncjs \
            --repo=cncjs \
            --tag="${GITHUB_REF_NAME}-latest" \
            --release-name="${GITHUB_REF_NAME}" \
            "*-macos-x64.*";
          yarn github-release upload \
            --owner=cncjs \
            --repo=cncjs \
            --tag="${GITHUB_REF_NAME}-latest" \
            --release-name="${GITHUB_REF_NAME}" \
            --body="${GIT_COMMIT_LOG}" \
            releases/macos/*;
        fi
    #- name: Upload release assets
    #  uses: actions/github-script@v6
    #  with:
    #    github-token: ${{ secrets.GITHUB_TOKEN }}
    #    script: |
    #      // https://github.com/actions/upload-release-asset/issues/47#issuecomment-659071145
    #      console.log('environment:', process.versions);
    - name: Release
      # gh, not softprops/action-gh-release@v1: that action failed with "Resource
      # not accessible by integration" where the same token uploads fine with gh.
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" ||
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
        gh release upload "$GITHUB_REF_NAME" releases/macos/* --repo "$GITHUB_REPOSITORY" --clobber

  build-macos-arm64:
    # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    runs-on: macos-latest
    needs: [check, touch-browser]
    strategy:
