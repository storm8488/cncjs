name: ci

# Validation of a commit: the dependencies come from yarn.lock as committed
# (`yarn install --immutable`), never refreshed here. Refreshing them is a
# deliberate act: see update-dependencies.yml (manual).

on:
  # https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#example-including-branches-and-tags
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - master
    # Sequence of patterns matched against refs/tags
    tags:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

# The Release steps of the build jobs attach the binaries to the GitHub release
# of a tag; the default GITHUB_TOKEN of this repository can only read.
permissions:
  contents: write

env:
  # Yarn 3.3.1 (.yarnrc.yml yarnPath) through corepack: no `npm install -g yarn`,
  # which installs Yarn classic 1.22 and only works because it delegates to yarnPath.
  YARN_VERSION: 3.3.1

jobs:
  check:
    # Lint, unit tests and the offline touch suite. The platform builds below
    # wait for this job and for touch-browser.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - name: Enable the repository's Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare "yarn@${YARN_VERSION}" --activate
        test "$(yarn --version)" = "${YARN_VERSION}"
    - name: Install dependencies from the lockfile
      run: yarn install --immutable
    - name: Lint
      run: yarn lint
    - name: Unit tests (Jest)
      run: yarn test
    - name: Touch offline suite
      run: node examples/cncjs-touch/verify-project.cjs --report "$RUNNER_TEMP/touch-offline-report.json"

  touch-browser:
    # The browser harness on the runner's Chrome, headless. Windows, because the
    # strict layout check measures the interface with Segoe UI, the first font
    # of its stack: on ubuntu-latest Chrome falls back to a wider font and
    # reports text overflowing by 2-8 px that the Windows run does not show.
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - name: Enable the repository's Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare "yarn@${YARN_VERSION}" --activate
        test "$(yarn --version)" = "${YARN_VERSION}"
    - name: Install dependencies from the lockfile
      run: yarn install --immutable
    - name: Touch browser harness (Chrome of the runner image, headless)
      run: node examples/cncjs-touch/browser-run.cjs --strict --out output/browser-run
    - name: Upload browser harness report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: touch-browser-run
        path: output/browser-run
        if-no-files-found: ignore
        retention-days: 14

  package:
    # Builds the npm package, installs it outside the checkout and checks the
    # HTTP routes of the installed server, the touch interface included: the
    # build ships examples/cncjs-touch/touch as dist/cncjs/touch
    # (scripts/copy-touch-assets.sh), so /touch/, /touch/app.js and
    # /touch/VERSION.json must answer 200 (TOUCH_REQUIRED=1, blocking).
    runs-on: ubuntu-latest
    env:
      TOUCH_REQUIRED: '1'
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - name: Enable the repository's Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare "yarn@${YARN_VERSION}" --activate
        test "$(yarn --version)" = "${YARN_VERSION}"
    - name: Install dependencies from the lockfile
      run: yarn install --immutable
    - name: Build, pack, install and start the package
      run: bash scripts/test-installed-package.sh

  build-linux:
    # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    # ubuntu-24.04, not ubuntu-latest: on Ubuntu 26.04 rpmbuild rejects the spec
    # written by electron-builder's fpm 1.9.3, so the .rpm targets fail.
    runs-on: ubuntu-24.04
    needs: [check, touch-browser]
    strategy:
      matrix:
        node-version: [24.x]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - name: Environment variables
      run: |
        # https://docs.github.com/en/actions/learn-github-actions/variables#default-environment-variables
        echo "• GITHUB_REF_NAME=$GITHUB_REF_NAME"
        echo "• GITHUB_REF_TYPE=$GITHUB_REF_TYPE" # `branch` or `tag`
        echo "• GITHUB_RUN_NUMBER=$GITHUB_RUN_NUMBER"
        echo "• GITHUB_SHA=$GITHUB_SHA"
        echo "• RUNNER_ARCH=$RUNNER_ARCH"
        echo "• RUNNER_NAME=$RUNNER_NAME"
        echo "• RUNNER_OS=$RUNNER_OS"
        echo "• RUNNER_TEMP=$RUNNER_TEMP"
        echo "• RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
    - name: Enable the repository's Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare "yarn@${YARN_VERSION}" --activate
        test "$(yarn --version)" = "${YARN_VERSION}"
    - name: Install dependencies from the lockfile and run the tests on this platform
      run: |
        yarn install --immutable
        yarn test
    - name: Run "build" script
      if: github.ref_type == 'tag'
      run: yarn run build
    - name: Run "build-latest" script
      if: github.ref_type == 'branch'
      run: yarn run build-latest
    - name: Build Linux binaries
      run: |
        yarn run build:linux
    - name: Prepare release assets
      shell: bash
      run: |
        GIT_COMMIT_LOG=`git log -1 --format='%ci %H %s'`
        PRODUCT_NAME=CNCjs
        PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
        PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
        mkdir -p releases/linux
        cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}.x86_64.rpm" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux.x86_64.rpm"
        cp -af "output/${PRODUCT_NAME}-${PACKAGE_VERSION}.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-x86_64.AppImage"
        cp -af "output/${PACKAGE_NAME}_${PACKAGE_VERSION}_amd64.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-amd64.deb"
        cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}.armv7l.rpm" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux.armv7l.rpm"
        cp -af "output/${PRODUCT_NAME}-${PACKAGE_VERSION}-armv7l.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-armv7l.AppImage"
        cp -af "output/${PACKAGE_NAME}_${PACKAGE_VERSION}_armv7l.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-armv7l.deb"
        cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}.aarch64.rpm" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux.aarch64.rpm"
        cp -af "output/${PRODUCT_NAME}-${PACKAGE_VERSION}-arm64.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-arm64.AppImage"
        cp -af "output/${PACKAGE_NAME}_${PACKAGE_VERSION}_arm64.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-arm64.deb"
        pushd releases/linux
        ln -sf ../../output/linux-unpacked "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-x64"
        tar zcfh "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-x64.tar.gz" "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-x64"
        rm -f "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-x64"
        ln -sf ../../output/linux-armv7l-unpacked "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-armv7l"
        tar zcfh "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-armv7l.tar.gz" "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-armv7l"
        rm -f "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-armv7l"
        ln -sf ../../output/linux-arm64-unpacked "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-arm64"
        tar zcfh "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-arm64.tar.gz" "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-arm64"
        rm -f "${PACKAGE_NAME}-${PACKAGE_VERSION}-linux-arm64"
        popd
        ls -al output releases/linux
        if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "master" ]]; then
          yarn github-release delete \
            --owner=cncjs \
            --repo=cncjs \
            --tag="${GITHUB_REF_NAME}-latest" \
            --release-name="${GITHUB_REF_NAME}" \
            "*-linux*";
          yarn github-release upload \
            --owner=cncjs \
            --repo=cncjs \
            --tag="${GITHUB_REF_NAME}-latest" \
            --release-name="${GITHUB_REF_NAME}" \
            --body="${GIT_COMMIT_LOG}" \
            releases/linux/*;
        fi
    #- name: Upload release assets
    #  uses: actions/github-script@v6
    #  with:
    #    github-token: ${{ secrets.GITHUB_TOKEN }}
    #    script: |
    #      // https://github.com/actions/upload-release-asset/issues/47#issuecomment-659071145
    #      console.log('environment:', process.versions);
    - name: Release
      # gh, not softprops/action-gh-release@v1: that action failed with "Resource
      # not accessible by integration" where the same token uploads fine with gh.
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" ||
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
        gh release upload "$GITHUB_REF_NAME" releases/linux/* --repo "$GITHUB_REPOSITORY" --clobber

  build-macos-x64:
    # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    runs-on: macos-15-intel
    needs: [check, touch-browser]
    strategy:
      matrix:
        node-version: [24.x]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
