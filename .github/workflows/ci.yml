      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "" ||
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
        gh release upload "$GITHUB_REF_NAME" releases/macos/* --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    runs-on: windows-latest
    needs: [check, touch-browser]
    strategy:
      matrix:
        node-version: [24.x]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Prepare VC++ Runtime
      run: choco install -y vcredist2017
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: yarn
    - name: Environment variables
      run: |
        # https://docs.github.com/en/actions/learn-github-actions/variables#default-environment-variables
