          yarn github-release upload \
            --owner=cncjs \
            --repo=cncjs \
            --tag="${GITHUB_REF_NAME}-latest" \
            --release-name="${GITHUB_REF_NAME}" \
            --body="${GIT_COMMIT_LOG}" \
            releases/macos/*;
        fi
    #- name: Upload release assets
    #  uses: actions/github-script@v6
    #  with:
    #    github-token: ${{ secrets.GITHUB_TOKEN }}
    #    script: |
    #      // https://github.com/actions/upload-release-asset/issues/47#issuecomment-659071145
    #      console.log('environment:', process.versions);
    - name: Release
      # gh, not softprops/action-gh-release@v1: that action failed with "Resource
